name: GRGabriellaRomeo
options:
  bundleIdPrefix: com.grgabriellaromeo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  GRGabriellaRomeo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: G-R Gabriella Romeo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GR_SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        GR_SUPABASE_URL: $(SUPABASE_URL)
        GR_STRIPE_PK: $(STRIPE_PK)
        GR_PAYPAL_CLIENT_ID: $(PAYPAL_CLIENT_ID)
        GR_PAYPAL_ENABLED: $(PAYPAL_ENABLED)
        GR_WEB_API_BASE_URL: $(WEB_API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.shopping
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIAppFonts:
          - Michroma.ttf
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    configFiles:
      Debug: Config/AppConfig.xcconfig
      Release: Config/AppConfig.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grgabriellaromeo.app
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 7
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: M293D8XT82
        ENABLE_DEBUG_DYLIB: NO
        SUPPORTS_MACCATALYST: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Config/GRGabriellaRomeoMac.entitlements
